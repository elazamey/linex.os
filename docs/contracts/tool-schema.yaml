{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://linex.os/contracts/p14/tool-schema.yaml",
  "title": "LINEX.OS P14 Tool descriptor",
  "description": "Contract-only schema for a P14 Tool descriptor. A Tool declares; P10 executes. Unknown, unpinned, or hash-mismatched Tools are BLOCKED. This schema grants no authority: capability_refs are descriptive references resolved by P12.",
  "$comment": "P14 — contracts only. No Tool runtime, no DSL, no implementation language. The JSON Schema draft is 2020-12; this file is a YAML 1.2 JSON-compatible document, so jq and JSON Schema validators read it without a YAML parser dependency.",
  "type": "object",
  "required": [
    "tool_id",
    "version",
    "name",
    "source",
    "integrity",
    "capability_refs",
    "risk_class",
    "execution_authority",
    "action_type",
    "trust_level",
    "input_schema",
    "output_schema",
    "timeout_seconds",
    "resource_limits",
    "evidence_requirements",
    "deterministic"
  ],
  "additionalProperties": false,
  "properties": {
    "tool_id": {
      "type": "string",
      "pattern": "^tool\\.[a-z][a-z0-9]*(\\.[a-z0-9_]+)+$",
      "description": "Stable dotted identifier, lower case, e.g. tool.example.fs_read."
    },
    "version": {
      "$ref": "#/$defs/semver",
      "description": "Exact immutable version. The literal value 'latest' is not a version and is invalid."
    },
    "name": {
      "type": "string",
      "minLength": 3,
      "maxLength": 120
    },
    "description": {
      "type": "string",
      "minLength": 1,
      "maxLength": 2000
    },
    "source": {
      "type": "object",
      "required": ["kind", "locator", "license"],
      "additionalProperties": false,
      "properties": {
        "kind": {
          "enum": ["repository", "package-registry", "upstream-release", "internal"]
        },
        "locator": {
          "type": "string",
          "minLength": 1,
          "maxLength": 500
        },
        "license": {
          "type": "string",
          "minLength": 1,
          "maxLength": 120
        }
      }
    },
    "integrity": {
      "type": "object",
      "required": ["algorithm", "hash", "pinning"],
      "additionalProperties": false,
      "properties": {
        "algorithm": {
          "const": "sha256"
        },
        "hash": {
          "$ref": "#/$defs/sha256",
          "description": "Integrity check only. A hash is not a signature and proves no signer identity."
        },
        "pinning": {
          "const": "IMMUTABLE"
        }
      }
    },
    "capability_refs": {
      "type": "array",
      "minItems": 1,
      "uniqueItems": true,
      "items": {
        "$ref": "#/$defs/capability_id"
      },
      "description": "REFERENCE_ONLY: descriptive P12 capability references, not grants, not possession, not authorization. P14 must not invent CAP_* identifiers."
    },
    "risk_class": {
      "$ref": "#/$defs/risk_class"
    },
    "execution_authority": {
      "$ref": "#/$defs/execution_authority",
      "description": "One of the five P10 executor authorities. browser, computer, mcp, tool, skill and workflow are not P10 executors and are invalid here."
    },
    "action_type": {
      "const": "tool.call"
    },
    "trust_level": {
      "$ref": "#/$defs/trust_level"
    },
    "input_schema": {
      "$ref": "#/$defs/embedded_schema",
      "description": "JSON Schema for the accepted inputs; validated before the Action is proposed. No secrets."
    },
    "output_schema": {
      "$ref": "#/$defs/embedded_schema",
      "description": "JSON Schema for the produced outputs; recorded with the Result. No secrets."
    },
    "timeout_seconds": {
      "type": "integer",
      "minimum": 1,
      "maximum": 86400
    },
    "resource_limits": {
      "$ref": "#/$defs/resource_limits"
    },
    "evidence_requirements": {
      "type": "array",
      "minItems": 1,
      "uniqueItems": true,
      "items": {
        "$ref": "#/$defs/evidence_requirement"
      }
    },
    "deterministic": {
      "const": true,
      "description": "Non-deterministic, evaluative, or self-modifying tools cannot be declared in P14."
    }
  },
  "allOf": [
    {
      "if": {
        "properties": {"execution_authority": {"const": "shell"}},
        "required": ["execution_authority"]
      },
      "then": {
        "properties": {
          "capability_refs": {"contains": {"const": "CAP_PROCESS_EXEC"}},
          "risk_class": {"enum": ["CLASS-4", "CLASS-5"]}
        }
      }
    },
    {
      "if": {
        "properties": {"execution_authority": {"const": "package"}},
        "required": ["execution_authority"]
      },
      "then": {
        "properties": {
          "capability_refs": {"contains": {"const": "CAP_PACKAGE_INSTALL"}},
          "risk_class": {"enum": ["CLASS-4", "CLASS-5"]}
        }
      }
    },
    {
      "if": {
        "properties": {"execution_authority": {"const": "file"}},
        "required": ["execution_authority"]
      },
      "then": {
        "properties": {
          "capability_refs": {"contains": {"enum": ["CAP_FS_READ", "CAP_FS_WRITE"]}}
        }
      }
    },
    {
      "if": {
        "properties": {"execution_authority": {"const": "network"}},
        "required": ["execution_authority"]
      },
      "then": {
        "properties": {
          "capability_refs": {"contains": {"enum": ["CAP_NETWORK_READ", "CAP_NETWORK_CONNECT"]}}
        }
      }
    },
    {
      "if": {
        "properties": {"execution_authority": {"const": "process"}},
        "required": ["execution_authority"]
      },
      "then": {
        "properties": {
          "capability_refs": {"contains": {"enum": ["CAP_PROCESS_EXEC", "CAP_PROCESS_READ"]}}
        }
      }
    },
    {
      "if": {
        "properties": {"trust_level": {"const": "untrusted"}},
        "required": ["trust_level"]
      },
      "then": {
        "properties": {
          "capability_refs": {
            "items": {"enum": ["CAP_FS_READ", "CAP_PROCESS_READ", "CAP_NETWORK_READ"]}
          }
        },
        "$comment": "An untrusted Tool may declare read-only capability references only."
      }
    }
  ],
  "$defs": {
    "semver": {
      "type": "string",
      "pattern": "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$"
    },
    "sha256": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "capability_id": {
      "enum": [
        "CAP_FS_READ",
        "CAP_FS_WRITE",
        "CAP_PROCESS_EXEC",
        "CAP_PROCESS_READ",
        "CAP_NETWORK_READ",
        "CAP_NETWORK_CONNECT",
        "CAP_PACKAGE_INSTALL",
        "CAP_SECRET_ACCESS"
      ],
      "description": "Existing P12 capability identifiers only. CAP_PACKAGE_REMOVE is DEFERRED/RESTRICTED and CAP_BROWSER/CAP_COMPUTER/CAP_MCP belong to executors that do not exist yet."
    },
    "risk_class": {
      "enum": ["CLASS-0", "CLASS-1", "CLASS-2", "CLASS-3", "CLASS-4", "CLASS-5", "CLASS-6"],
      "description": "The existing P11 classification. CLASS-6 is DENY Always. A declaration never lowers realized risk."
    },
    "execution_authority": {
      "enum": ["shell", "process", "file", "network", "package"]
    },
    "trust_level": {
      "enum": ["trusted", "semi_trusted", "untrusted"]
    },
    "evidence_requirement": {
      "enum": [
        "p9_action_id",
        "p9_result_hash",
        "p9_event_ref",
        "executor_id",
        "exit_status",
        "verifier_evidence_ref",
        "limit_evidence"
      ]
    },
    "embedded_schema": {
      "type": "object",
      "minProperties": 1,
      "description": "An embedded JSON Schema document. Secrets are forbidden; SECRET_REFERENCE only."
    },
    "resource_limits": {
      "type": "object",
      "required": ["cpu_seconds", "memory_mb", "output_bytes", "process_count", "file_descriptors"],
      "additionalProperties": false,
      "properties": {
        "cpu_seconds": {"type": "integer", "minimum": 1, "maximum": 86400},
        "memory_mb": {"type": "integer", "minimum": 1, "maximum": 1048576},
        "output_bytes": {"type": "integer", "minimum": 1, "maximum": 1073741824},
        "process_count": {"type": "integer", "minimum": 1, "maximum": 1024},
        "file_descriptors": {"type": "integer", "minimum": 1, "maximum": 65536}
      },
      "description": "Limits are mandatory in P14. A high-risk Tool without limits is invalid, never defaulted."
    }
  }
}
