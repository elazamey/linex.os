{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://linex.os/contracts/p14/skill-schema.yaml",
  "title": "LINEX.OS P14 Skill descriptor",
  "description": "Contract-only schema for a P14 Skill descriptor: an ordered, linear list of steps over pinned Tools with typed bindings. Each step is separately authorized by P11/P12 before P10. This schema grants nothing.",
  "$comment": "P14 — contracts only. No Skill runtime, no orchestration engine, no DSL, no expression evaluation before P18. Linear order is the array order; depends_on must name the immediately preceding step (a non-schema invariant checked by tests/tool-skill.test.sh).",
  "type": "object",
  "required": [
    "skill_id",
    "version",
    "name",
    "description",
    "risk_class",
    "trust_level",
    "steps",
    "resource_budget",
    "evidence_requirements",
    "on_step_failure",
    "fallback",
    "retry",
    "deterministic"
  ],
  "additionalProperties": false,
  "properties": {
    "skill_id": {
      "type": "string",
      "pattern": "^skill\\.[a-z][a-z0-9]*(\\.[a-z0-9_]+)+$"
    },
    "version": {
      "$ref": "#/$defs/semver"
    },
    "name": {
      "type": "string",
      "minLength": 3,
      "maxLength": 120
    },
    "description": {
      "type": "string",
      "minLength": 1,
      "maxLength": 2000
    },
    "risk_class": {
      "$ref": "#/$defs/risk_class",
      "description": "Must be greater than or equal to the highest step risk_class (a non-schema invariant). CLASS-6 is DENY Always."
    },
    "trust_level": {
      "$ref": "#/$defs/trust_level"
    },
    "steps": {
      "type": "array",
      "minItems": 1,
      "maxItems": 64,
      "items": {
        "$ref": "#/$defs/step"
      }
    },
    "resource_budget": {
      "$ref": "#/$defs/resource_limits",
      "description": "Mandatory Skill budget. Step limits may not exceed it (a non-schema invariant)."
    },
    "evidence_requirements": {
      "type": "array",
      "minItems": 1,
      "uniqueItems": true,
      "items": {
        "$ref": "#/$defs/evidence_requirement"
      }
    },
    "on_step_failure": {
      "const": "BLOCKED",
      "description": "No skip, no continue, no fallback, no automatic retry."
    },
    "fallback": {
      "const": "NONE",
      "description": "No alternate Tool and no alternate version substitution."
    },
    "retry": {
      "const": "NONE",
      "description": "A retry is a new, separately authorized P9 Action."
    },
    "deterministic": {
      "const": true
    }
  },
  "$defs": {
    "semver": {
      "type": "string",
      "pattern": "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$"
    },
    "step_id": {
      "type": "string",
      "pattern": "^step-[0-9]{2}$"
    },
    "sha256": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "capability_id": {
      "enum": [
        "CAP_FS_READ",
        "CAP_FS_WRITE",
        "CAP_PROCESS_EXEC",
        "CAP_PROCESS_READ",
        "CAP_NETWORK_READ",
        "CAP_NETWORK_CONNECT",
        "CAP_PACKAGE_INSTALL",
        "CAP_SECRET_ACCESS"
      ]
    },
    "risk_class": {
      "enum": ["CLASS-0", "CLASS-1", "CLASS-2", "CLASS-3", "CLASS-4", "CLASS-5", "CLASS-6"]
    },
    "trust_level": {
      "enum": ["trusted", "semi_trusted", "untrusted"]
    },
    "evidence_requirement": {
      "enum": [
        "p9_action_id",
        "p9_result_hash",
        "p9_event_ref",
        "executor_id",
        "exit_status",
        "verifier_evidence_ref",
        "limit_evidence"
      ]
    },
    "value_type": {
      "enum": ["string", "number", "integer", "boolean", "object", "array"]
    },
    "resource_limits": {
      "type": "object",
      "required": ["cpu_seconds", "memory_mb", "output_bytes", "process_count", "file_descriptors"],
      "additionalProperties": false,
      "properties": {
        "cpu_seconds": {"type": "integer", "minimum": 1, "maximum": 86400},
        "memory_mb": {"type": "integer", "minimum": 1, "maximum": 1048576},
        "output_bytes": {"type": "integer", "minimum": 1, "maximum": 1073741824},
        "process_count": {"type": "integer", "minimum": 1, "maximum": 1024},
        "file_descriptors": {"type": "integer", "minimum": 1, "maximum": 65536}
      }
    },
    "tool_ref": {
      "type": "object",
      "required": ["tool_id", "version", "hash"],
      "additionalProperties": false,
      "properties": {
        "tool_id": {
          "type": "string",
          "pattern": "^tool\\.[a-z][a-z0-9]*(\\.[a-z0-9_]+)+$"
        },
        "version": {
          "$ref": "#/$defs/semver"
        },
        "hash": {
          "$ref": "#/$defs/sha256",
          "description": "Exact pinned hash. A mismatch is BLOCKED with no fallback to latest."
        }
      }
    },
    "binding": {
      "oneOf": [
        {
          "type": "object",
          "required": ["target_input", "source", "type", "required", "value"],
          "additionalProperties": false,
          "properties": {
            "target_input": {"type": "string", "minLength": 1, "maxLength": 200},
            "source": {"const": "literal"},
            "type": {"$ref": "#/$defs/value_type"},
            "required": {"type": "boolean"},
            "value": {
              "description": "Literal value. Its JSON type must match the declared type (a non-schema invariant). Secrets are forbidden."
            }
          }
        },
        {
          "type": "object",
          "required": ["target_input", "source", "from_step", "output_path", "type", "required"],
          "additionalProperties": false,
          "properties": {
            "target_input": {"type": "string", "minLength": 1, "maxLength": 200},
            "source": {"const": "step_output"},
            "from_step": {"$ref": "#/$defs/step_id"},
            "output_path": {"type": "string", "minLength": 1, "maxLength": 300},
            "type": {"$ref": "#/$defs/value_type"},
            "required": {"type": "boolean"}
          }
        }
      ]
    },
    "step": {
      "type": "object",
      "required": [
        "step_id",
        "name",
        "depends_on",
        "tool",
        "capability_refs",
        "risk_class",
        "input_bindings"
      ],
      "additionalProperties": false,
      "properties": {
        "step_id": {
          "$ref": "#/$defs/step_id"
        },
        "name": {
          "type": "string",
          "minLength": 3,
          "maxLength": 200
        },
        "depends_on": {
          "description": "null for the first step; the immediately preceding step otherwise (a non-schema invariant).",
          "anyOf": [
            {"$ref": "#/$defs/step_id"},
            {"type": "null"}
          ]
        },
        "tool": {
          "$ref": "#/$defs/tool_ref"
        },
        "capability_refs": {
          "type": "array",
          "minItems": 1,
          "uniqueItems": true,
          "items": {"$ref": "#/$defs/capability_id"},
          "description": "REFERENCE_ONLY: descriptive P12 references, not grants."
        },
        "risk_class": {
          "$ref": "#/$defs/risk_class"
        },
        "input_bindings": {
          "type": "array",
          "maxItems": 64,
          "items": {"$ref": "#/$defs/binding"},
          "description": "Typed bindings only. step_output bindings may reference only earlier steps in the same run."
        },
        "resource_limits": {
          "$ref": "#/$defs/resource_limits",
          "description": "Optional per-step limits; they may not exceed the Skill resource_budget (a non-schema invariant)."
        }
      }
    }
  }
}
